name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04 # older glibc = AppImage runs on more distros
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: |
          mkdir -p AppDir/usr/bin
          cp target/release/reskate-installer AppDir/usr/bin/
          ln -s usr/bin/reskate-installer AppDir/AppRun
          printf '[Desktop Entry]\nType=Application\nName=ReSkate Installer\nExec=reskate-installer\nIcon=reskate-installer\nCategories=Game;\nTerminal=false\n' > AppDir/reskate-installer.desktop
          touch AppDir/reskate-installer.png # ponytail: empty icon, add real art later
          curl -Lo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir reskate-installer-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with: { name: reskate-installer-linux, path: reskate-installer-x86_64.AppImage }
